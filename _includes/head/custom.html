{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<style>
  .lang-switch {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .lang-switch img {
    width: 40px;
    height: 40px;
    cursor: pointer;
  }

  .lang-switch span {
    color: var(--global-text-color-light);
    font-size: 0.95rem;
  }

  .home-hero {
    margin: 1rem 0 2rem;
    padding: 2rem;
    border: 1px solid var(--global-border-color);
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(82, 173, 200, 0.18), rgba(82, 173, 200, 0.05));
  }

  .home-hero__inner {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 1.5rem;
    align-items: center;
  }

  .home-hero__image {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 24px;
    box-shadow: 0 16px 30px rgba(0, 0, 0, 0.12);
  }

  .home-hero h1,
  .home-hero h2 {
    margin: 0 0 0.75rem;
  }

  .home-hero p {
    margin-bottom: 1rem;
  }

  .home-badges,
  .home-actions,
  .home-tag-list,
  .home-doc-grid,
  .home-media-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .home-badge,
  .home-tag {
    display: inline-flex;
    align-items: center;
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--global-border-color);
    background: var(--global-bg-color);
    color: var(--global-text-color);
    font-size: 0.95rem;
    line-height: 1.2;
  }

  .home-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 132px;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    border: 1px solid var(--global-border-color);
    text-decoration: none !important;
    font-weight: 600;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .home-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
  }

  .home-button--primary {
    background: var(--global-base-color);
    color: #fff !important;
    border-color: transparent;
  }

  .home-button--ghost {
    background: var(--global-bg-color);
    color: var(--global-text-color) !important;
  }

  .home-section {
    margin: 2rem 0;
  }

  .home-section__title {
    margin-bottom: 1rem;
    padding-left: 0.75rem;
    border-left: 4px solid var(--global-base-color);
  }

  .home-grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 1rem;
  }

  .home-card,
  .home-feature,
  .home-doc,
  .home-media-card,
  .home-note {
    border: 1px solid var(--global-border-color);
    border-radius: 18px;
    background: var(--global-bg-color);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.04);
  }

  .home-card,
  .home-feature,
  .home-note {
    padding: 1.25rem;
  }

  .home-card {
    grid-column: span 4;
  }

  .home-feature {
    grid-column: span 12;
  }

  .home-card h3,
  .home-feature h3,
  .home-media-card h3 {
    margin-top: 0;
    margin-bottom: 0.75rem;
  }

  .home-card ul,
  .home-feature ul {
    margin-bottom: 0;
  }

  .home-doc-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1rem;
  }

  .home-doc {
    display: block;
    padding: 1rem 1.1rem;
    text-decoration: none !important;
    color: inherit !important;
  }

  .home-doc strong {
    display: block;
    margin-bottom: 0.35rem;
  }

  .home-doc span {
    color: var(--global-text-color-light);
    font-size: 0.95rem;
  }

  .home-doc:hover,
  .home-media-card:hover {
    transform: translateY(-2px);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.08);
  }

  .home-media-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }

  .home-media-card {
    overflow: hidden;
    text-decoration: none !important;
    color: inherit !important;
  }

  .home-media-card img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }

  .home-media-card__body {
    padding: 1rem 1.1rem;
  }

  .home-note {
    border-left: 4px solid var(--global-base-color);
  }

  .home-note p:last-child,
  .home-card p:last-child,
  .home-feature p:last-child {
    margin-bottom: 0;
  }

  @media (max-width: 900px) {
    .home-hero__inner,
    .home-grid,
    .home-doc-grid,
    .home-media-grid {
      grid-template-columns: 1fr;
    }

    .home-card,
    .home-feature {
      grid-column: span 1;
    }

    .home-hero {
      padding: 1.25rem;
    }

    .home-hero__image {
      width: 132px;
      height: 132px;
    }
  }
</style>

<!-- end custom head snippets -->
